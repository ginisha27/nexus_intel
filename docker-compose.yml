services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_intel
    ports:
      - "5433:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexus_intel
    NODE_ENV: production
    PORT: 4000
    INGEST_SECRET_KEY: ${f13ea01e42f20d8a57b734952346eac52dd1da1be40bd6213126d88ee3c68bba}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  nexus_pgdata:
